{{define "content"}}
{{$p := .Project}}{{$f := .D.F}}
<div class="page wide">
  <div class="head">
    <h1>Documents</h1>
    <button class="btn" data-toggle="#newdoc">New document</button>
  </div>
  <form id="newdoc" class="panel form-grid" data-api="POST /api/projects/{{$p.Key}}/docs" data-then="goto:/d/{ref}" hidden>
    <label>Type <select name="type">{{range vocab "doctypes"}}<option>{{.}}</option>{{end}}</select></label>
    <label>Title <input name="title" placeholder="or start the body with # Title"></label>
    <label class="span2">Link to <input name="for" data-type="list" placeholder="{{$p.Key}}-12, {{$p.Key}}-E2"></label>
    <label class="span2">Body <textarea name="body" rows="10" placeholder="Markdown"></textarea></label>
    <label class="check"><input type="checkbox" name="submit"> Submit for review</label>
    <div class="row end"><button class="btn primary">Create</button></div>
  </form>
  <form class="filters panel" method="get">
    <input type="search" name="q" value="{{$f.Query}}" placeholder="Search">
    <select name="type"><option value="">any type</option>{{range vocab "doctypes"}}<option {{if eq $f.Type .}}selected{{end}}>{{.}}</option>{{end}}</select>
    <select name="status"><option value="">any status</option>{{range vocab "docstatuses"}}<option value="{{.}}" {{if eq $f.Status .}}selected{{end}}>{{label .}}</option>{{end}}</select>
    <button class="btn">Filter</button>
  </form>
  {{template "doctable" .D.Docs}}
</div>
{{end}}
