services:
  tasker:
    build: .
    image: tasker:latest
    container_name: tasker
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
      # A second address to listen on, e.g. this machine's Tailscale 100.x.y.z,
      # so other devices on that private network can open tasker. The default
      # repeats the line above, which Compose collapses into one binding: an
      # unset variable must never render as ":7777:7777", which would bind every
      # interface. tasker has no login: everyone who can reach the address can
      # read and change everything.
      - "${TASKER_EXTRA_BIND_ADDRESS:-127.0.0.1}:7777:7777"
    environment:
      # Optional push notifications (see .env.example). Empty means off.
      TASKER_NOTIFY_URL: ${TASKER_NOTIFY_URL:-}
      TASKER_NOTIFY_TOKEN: ${TASKER_NOTIFY_TOKEN:-}
      TASKER_PUBLIC_URL: ${TASKER_PUBLIC_URL:-}
      # Backups: every 24h, newest 14 kept, unless set otherwise in .env.
      TASKER_BACKUP_EVERY: ${TASKER_BACKUP_EVERY:-24h}
      TASKER_BACKUP_KEEP: ${TASKER_BACKUP_KEEP:-14}
    volumes:
      - tasker-data:/data
      # Backups live apart from the data: in their own volume by default, or in
      # a folder on this machine when TASKER_BACKUP_HOST_DIR is an absolute path.
      - ${TASKER_BACKUP_HOST_DIR:-tasker-backups}:/backups

volumes:
  tasker-data:
  tasker-backups:
